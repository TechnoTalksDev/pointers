<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Primary Meta Tags -->
		<title>Realtime Pointers 🪄</title>
		<meta name="title" content="Realtime Pointers - See everyone's cursor in real-time" />
		<meta
			name="description"
			content="A collaborative real-time cursor tracking application that lets you see everyone's pointer position with minimal latency."
		/>

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://pointers.yourdomain.com/" />
		<meta property="og:title" content="Realtime Pointers - See everyone's cursor in real-time" />
		<meta
			property="og:description"
			content="A collaborative real-time cursor tracking application that lets you see everyone's pointer position with minimal latency."
		/>
		<meta property="og:image" content="%sveltekit.assets%/og-image.png" />

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://pointers.yourdomain.com/" />
		<meta
			property="twitter:title"
			content="Realtime Pointers - See everyone's cursor in real-time"
		/>
		<meta
			property="twitter:description"
			content="A collaborative real-time cursor tracking application that lets you see everyone's pointer position with minimal latency."
		/>
		<meta property="twitter:image" content="%sveltekit.assets%/og-image.png" />

		<!-- Theme Color -->
		<meta name="theme-color" content="#000000" />

		<!-- Additional Meta -->
		<meta
			name="keywords"
			content="realtime, pointers, cursor tracking, collaborative, svelte, supabase"
		/>
		<meta name="author" content="Pointers App" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
